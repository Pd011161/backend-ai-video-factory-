[project]
name = "video-factory-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # PostgreSQL driver. Unused when DATABASE_URL is sqlite:// — it is a hard dependency rather than
    # an extra so `uv sync` gives every environment the same lockfile whichever backend it points at.
    "psycopg[binary]>=3.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.36.0",
    "yt-dlp>=2024.12.0",
    "langchain-google-vertexai>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.2.4",
    "langfuse>=4.7.1",
    "openai>=1.40.0",
    "fonttools>=4.63.0",
    "google-api-python-client>=2.198.0",
    "tqdm>=4.68.2",
    "weasyprint>=69.0",
    "faster-whisper>=1.0.0",   # revoice + subtitle speech-window (VAD) detection
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
